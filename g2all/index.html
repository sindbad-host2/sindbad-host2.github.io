<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sindbad-Host</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body {
    background-image: url('img.jpg');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-color: #0b1021;
    color: #ffffff;
    font-family: Arial, sans-serif;
    text-align: center;
  }

  .overlay {
    width: 100%;
    min-height: 100vh;
    background: rgba(0, 0, 0, 0.55);
    padding: 32px 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .panel {
    background: rgba(15, 23, 42, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 12px;
    padding: 24px 28px;
    max-width: 680px;
    width: 100%;
    box-sizing: border-box;
  }

  h1 {
    margin: 0 0 12px;
    font-size: 34px;
  }

  #msgs {
    margin: 14px 0 24px;
    font-size: 19px;
    color: #e2e8f0;
    min-height: 28px;
  }

  .btn {
    background: #1d4ed8;
    color: #ffffff;
    border: 2px solid #60a5fa;
    border-radius: 10px;
    padding: 15px 30px;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
  }

  .btn:hover,
  .btn:focus {
    background: #2563eb;
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
</style>
</head>
<body>
<div class="overlay">
  <div class="panel">
    <h1>Sindbad-Host</h1>
    <div id="msgs">Press button to start &amp; load GoldHEN</div>
    <button id="start-btn" class="btn" onclick="triggerExploit()">
      Load GoldHEN
    </button>
  </div>
</div>

<script type="module">
  window.triggerExploit = async function () {
    const btn = document.getElementById("start-btn");
    const msgs = document.getElementById("msgs");
    if (btn) btn.disabled = true;
    if (msgs) msgs.innerText = "Starting exploit & loading files...";

    try {
      if (typeof window.runLapseExploit === "function") {
        await window.runLapseExploit();
      } else {
        await import("./slopkit/chain_lapse.js");
      }
    } catch (err) {
      if (msgs) {
        msgs.innerText = "Error: " + (err && err.message ? err.message : String(err));
        msgs.style.color = "yellow";
      }
      if (btn) btn.disabled = false;
    }
  };
</script>
</body>
</html>
