<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sindbad-Host</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body {
    background-image: url('img.jpg');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-color: #121212;
    color: #ffffff;
    font-family: Arial, sans-serif;
    text-align: center;
  }

  .overlay {
    width: 100%;
    min-height: 100vh;
    background: rgba(0, 0, 0, 0.55);
    padding: 24px;
    box-sizing: border-box;
  }
</style>
</head>
<body>
<div class="overlay">
  <h1>Sindbad-Host</h1>
  <hr>
  <h2 id="status" style="margin-top: 40px;">Initializing Exploit...</h2>

  <button id="goldhen-btn" onclick="loadGoldHEN()" style="padding: 12px 24px; font-size: 16px; cursor: pointer; margin-top: 20px;">
    Load GoldHEN
  </button>
</div>

<script src="slopkit/int64.js"></script>
<script src="slopkit/mem.js"></script>
<script src="slopkit/ps4_offsets.js"></script>
<script src="slopkit/core.js"></script>
<script src="slopkit/rpc_worker.js"></script>
<script src="slopkit/jb.js"></script>
<script src="slopkit/chain_lapse.js"></script>
<script src="slopkit/afterglow.js"></script>

<script>
  function loadGoldHEN() {
    const statusEl = document.getElementById("status");
    if (statusEl) {
      statusEl.innerText = "Loading GoldHEN...";
    }
    if (typeof loadPayload === "function") {
      loadPayload("goldhen_2.4b18.14.bin");
    }
  }
</script>
</body>
</html>
